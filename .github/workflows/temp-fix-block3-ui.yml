name: Fix Block 3 UI
on:
  push:
    branches:
      - feature/fluxos-profissionais
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/fluxos-profissionais
          fetch-depth: 0
      - name: Corrigir interface
        run: python scripts/fix_block3_ui.py
      - name: Commit correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Corrigir interface e preservação das permutas"
          git push origin HEAD:feature/fluxos-profissionais
