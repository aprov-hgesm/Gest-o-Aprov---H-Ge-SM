name: Apply integrity block
on:
  push:
    branches:
      - improve/integridade-funcional-v3
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: improve/integridade-funcional-v3
          fetch-depth: 0
      - name: Apply integrity corrections
        run: python scripts/apply_integrity_block.py
      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/CardapioSemanal.tsx components/DocumentExports.tsx
          git commit -m "Corrigir integridade funcional de escalas, afastamentos e cardápios"
          git push origin HEAD:improve/integridade-funcional-v3
