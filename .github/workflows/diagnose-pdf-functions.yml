name: Diagnose PDF export functions

on:
  push:
    branches:
      - diag/pdf-funcionalidades-20260914
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Inventory all PDF and print related code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          extensions={'.ts','.tsx','.js','.jsx','.mjs','.cjs'}
          patterns=[
            re.compile(r'jspdf|html2canvas|window\.print|\.print\(|\.save\(|download|baixar\s+pdf|exportar\s+pdf|gerar\s+pdf', re.I),
            re.compile(r'print-sheet|saque-carnes-print-sheet|cardapio-print-sheet', re.I),
          ]
          excluded={'node_modules','.next','.git'}
          matched=[]
          for path in Path('.').rglob('*'):
            if not path.is_file() or path.suffix.lower() not in extensions or any(part in excluded for part in path.parts):
              continue
            text=path.read_text(encoding='utf-8', errors='ignore')
            hits=[]
            for idx,line in enumerate(text.splitlines(),1):
              if any(p.search(line) for p in patterns):
                hits.append((idx,line.strip()))
            if hits:
              matched.append((str(path),hits))
          print('PDF_EXPORT_FILES=', [p for p,_ in matched])
          for path,hits in matched:
            print(f'=== {path} ===')
            for line_no,line in hits:
              print(f'{line_no}: {line}')
          PY

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Chromium
        run: |
          npm install --prefix /tmp/aprov-browser-tools --no-save --package-lock=false playwright
          node /tmp/aprov-browser-tools/node_modules/playwright/cli.js install --with-deps chromium

      - name: Verify actual PDF downloads in browser
        run: bunx firebase emulators:exec --only firestore --project demo-aprov --config tests/firebase.browser.json "node tests/pdf-download-smoke.mjs"
        env:
          APROV_PLAYWRIGHT_MODULE: /tmp/aprov-browser-tools/node_modules/playwright/index.mjs

      - name: Upload generated PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-download-diagnostics
          path: test-results/pdf/
          if-no-files-found: ignore
