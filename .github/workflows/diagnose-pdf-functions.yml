name: Diagnose PDF export functions

on:
  push:
    branches:
      - diag/pdf-funcionalidades-20260914
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Inventory PDF and print related code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [Path('app/page.tsx'), Path('components/CardapioSemanal.tsx')]
          patterns = [
              re.compile(r'jsPDF|html2canvas|window\.print|\.print\(|\.save\(|download|Baixar PDF|Exportar PDF|Gerar PDF', re.I),
              re.compile(r'PDF|Imprimir|Relat[oó]rio|Escala|Card[aá]pio|Saque de Carnes', re.I),
              re.compile(r'print-sheet|print_sheet|printSheet|saque-carnes-print-sheet|cardapio-print-sheet', re.I),
          ]
          for path in files:
              print(f'=== {path} ===')
              lines = path.read_text(encoding='utf-8').splitlines()
              hits = set()
              for i, line in enumerate(lines):
                  if any(p.search(line) for p in patterns):
                      hits.add(i)
              for i in sorted(hits):
                  start=max(0,i-2); end=min(len(lines),i+3)
                  print(f'--- context around line {i+1} ---')
                  for j in range(start,end):
                      print(f'{j+1}: {lines[j]}')
              print()
          PY
