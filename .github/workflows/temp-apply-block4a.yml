name: Apply Block 4A Functional Audit
on:
  push:
    branches:
      - fix/bloco4a-auditoria-funcional
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/bloco4a-auditoria-funcional
          fetch-depth: 0
      - name: Aplicar correções do Bloco 4A
        run: |
          set +e
          output=$(python scripts/apply_block4a_audit_fixes.py 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ] && [[ "$output" != *"[workflow-block4a-test] trecho não encontrado"* ]]; then
            exit "$status"
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('components/CardapioSemanal.tsx')
          t = p.read_text()
          if '  Archive,\n' not in t:
              marker = '  RotateCcw, \n'
              if marker not in t:
                  raise SystemExit('Import de ícones não encontrado para Archive')
              t = t.replace(marker, marker + '  Archive,\n', 1)
              p.write_text(t)
          PY
          git checkout -- .github/workflows/validate.yml
      - name: Commit das correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/CardapioSemanal.tsx components/ProfessionalFlows.tsx components/DocumentExports.tsx tests/professional-flows.test.ts
          git commit -m "Aplicar correções da auditoria funcional Bloco 4A"
          git push origin HEAD:fix/bloco4a-auditoria-funcional
