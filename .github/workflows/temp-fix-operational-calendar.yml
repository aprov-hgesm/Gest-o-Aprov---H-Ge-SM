name: Fix Operational Calendar Layout
on:
  push:
    branches:
      - feature/central-operacional
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/central-operacional
          fetch-depth: 0
      - name: Corrigir escopo do calendário
        run: python scripts/fix_operational_calendar_layout.py
      - name: Commit da correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/OperationalDashboard.tsx
          git commit -m "Corrigir renderização do calendário operacional"
          git push origin HEAD:feature/central-operacional
