name: Temporary manual roster cleanup

on:
  push:
    branches:
      - fix/escala-manual-sem-regras

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/escala-manual-sem-regras
          fetch-depth: 0
      - name: Apply cleanup
        run: python .github/scripts/apply_manual_roster_cleanup.py
      - name: Commit cleanup
        run: |
          rm .github/workflows/temp-manual-roster-cleanup.yml
          rm .github/scripts/apply_manual_roster_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/temp-manual-roster-cleanup.yml .github/scripts/apply_manual_roster_cleanup.py
          git commit -m "Tornar escala manual sem regras de seleção"
          git push origin HEAD:fix/escala-manual-sem-regras
