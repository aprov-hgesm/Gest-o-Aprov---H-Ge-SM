name: Refine integrity block
on:
  push:
    branches:
      - improve/integridade-funcional-v3
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: improve/integridade-funcional-v3
          fetch-depth: 0
      - name: Apply refinements
        run: python scripts/refine_integrity.py
      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/DocumentExports.tsx
          git commit -m "Refinar integridade operacional e preservar histórico"
          git push origin HEAD:improve/integridade-funcional-v3
