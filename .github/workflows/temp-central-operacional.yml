name: Integrate Central Operacional
on:
  push:
    branches:
      - feature/central-operacional
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/central-operacional
          fetch-depth: 0
      - name: Apply dashboard integration
        run: python scripts/add_central_operacional.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Integrar Central Operacional ao fluxo principal"
          git push origin HEAD:feature/central-operacional
