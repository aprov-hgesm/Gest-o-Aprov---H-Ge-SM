name: Apply Block 3 Professional Flows
on:
  push:
    branches:
      - feature/fluxos-profissionais
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/fluxos-profissionais
          fetch-depth: 0
      - name: Ajustar patch temporariamente
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_block3_professional_flows.py')
          t = p.read_text()
          old = "text = replace_once(text, \"      workflow: {\\n        status: 'EM_ELABORACAO',\", \"      version: 1,\\n      versions: [],\\n      workflow: {\\n        status: 'EM_ELABORACAO',\", 'duplicate version init')"
          new = "text = text.replace(\"      workflow: {\\n        status: 'EM_ELABORACAO',\", \"      version: 1,\\n      versions: [],\\n      workflow: {\\n        status: 'EM_ELABORACAO',\", 1)"
          if old not in t:
              raise SystemExit('trecho temporário não encontrado')
          p.write_text(t.replace(old, new, 1))
          PY
      - name: Aplicar Bloco 3
        run: python scripts/apply_block3_professional_flows.py
      - name: Commit Bloco 3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/CardapioSemanal.tsx components/OperationalDashboard.tsx lib/persistence/validation.ts
          git commit -m "Implementar Bloco 3 de fluxos profissionais"
          git push origin HEAD:feature/fluxos-profissionais
