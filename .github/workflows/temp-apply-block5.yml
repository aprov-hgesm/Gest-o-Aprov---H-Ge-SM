name: Apply Block 5 Saque Operacional
on:
  push:
    branches:
      - feature/bloco5-saque-operacional
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/bloco5-saque-operacional
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Aplicar integração do Bloco 5
        run: python scripts/apply_block5.py
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run typecheck
      - name: Block 5 domain tests
        run: node --test tests/block5-saque-operacional.test.ts
      - name: Block 5 structural smoke
        run: node tests/block5-ui-smoke.mjs
      - name: Production build
        run: bun run build
        env:
          NODE_ENV: production
      - name: Commit validated Block 5 integration
        run: |
          rm scripts/apply_block5.py .github/workflows/temp-apply-block5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrar módulo operacional do Saque de Carnes"
          git push origin HEAD:feature/bloco5-saque-operacional
