name: Apply cardapio UI refactor
on:
  push:
    branches:
      - codex/cardapio-ui-proteinas
    paths:
      - .github/workflows/cardapio-ui-refactor.yml
      - scripts/refactor_cardapio_ui.py
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/cardapio-ui-proteinas
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Apply visual refactor
        run: python3 scripts/refactor_cardapio_ui.py
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run typecheck
      - name: Persistence tests
        run: bun run test
      - name: Production build
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/CardapioSemanal.tsx
          git diff --cached --quiet && exit 0
          git commit -m "refactor: simplify cardapio meal editor and protein overview"
          git push origin HEAD:codex/cardapio-ui-proteinas
