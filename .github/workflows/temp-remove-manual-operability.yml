name: Remove manual operability fields
on:
  push:
    branches:
      - improve/integridade-funcional-v3
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: improve/integridade-funcional-v3
          fetch-depth: 0
      - name: Apply operability correction
        run: python scripts/remove_manual_operability.py
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Derivar afastamento e contagem exclusivamente dos módulos operacionais"
          git push origin HEAD:improve/integridade-funcional-v3
