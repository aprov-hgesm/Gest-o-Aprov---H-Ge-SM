name: Finish Central Operacional
on:
  push:
    branches:
      - feature/central-operacional
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/central-operacional
          fetch-depth: 0
      - name: Aplicar integração final
        run: python scripts/finish_central_operacional.py
      - name: Commit final do Bloco 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/OperationalDashboard.tsx .github/workflows/validate.yml
          git commit -m "Finalizar Central Operacional com calendário e alertas cruzados"
          git push origin HEAD:feature/central-operacional
