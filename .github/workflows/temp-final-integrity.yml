name: Final integrity refinement
on:
  push:
    branches:
      - improve/integridade-funcional-v3
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: improve/integridade-funcional-v3
          fetch-depth: 0
      - name: Apply final refinements
        run: python scripts/final_integrity_refinement.py
      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/CardapioSemanal.tsx
          git commit -m "Refinar histórico de afastamentos e revisão do cardápio"
          git push origin HEAD:improve/integridade-funcional-v3
