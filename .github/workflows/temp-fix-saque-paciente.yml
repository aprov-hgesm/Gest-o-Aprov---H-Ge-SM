name: Temporary patient meat requisition fix

on:
  push:
    branches:
      - fix/saque-carnes-pacientes-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/saque-carnes-pacientes-final
          fetch-depth: 0
      - name: Apply patient meat requisition support
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          component = Path('components/CardapioSemanal.tsx')
          source = component.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
          """  almoco: {
            geral: MealAlmocoGeral;
            pacienteProteina: string; // e.g. 'PEITO DE FRANGO GRELHADO'
          };
          jantarPaciente: {
            prato: string;
            proteina?: string;
          };
""",
          """  almoco: {
            geral: MealAlmocoGeral;
            pacienteProteina: string; // Preparação exibida no cardápio do paciente
            pacienteTipoCarne?: string; // Corte/matéria-prima para o Saque de Carnes
            pacienteQuantidadeKg?: number | string; // Quantidade em kg para o Saque de Carnes
          };
          jantarPaciente: {
            prato: string;
            proteina?: string;
            tipoCarne?: string; // Corte/matéria-prima para o Saque de Carnes
            quantidadeKg?: number | string; // Quantidade em kg para o Saque de Carnes
          };
""",
          'day cardapio patient meat fields')

          replace_once(
          """  preparacao: string;
            tipoCarne: string;
            quantidadeKg: number;
""",
          """  preparacao: string;
            origem: 'ALMOÇO GERAL' | 'ALMOÇO PACIENTE' | 'JANTAR PACIENTE';
            tipoCarne: string;
            quantidadeKg: number;
""",
          'saque item origin')

          pattern = re.compile(r"export const gerarListaSaqueCarnes = \(dias: DayCardapio\[\]\): ItemSaqueProcessado\[\] => \{.*?\n\};\n\nexport const generateWeeklyDates", re.S)
          replacement = """export const gerarListaSaqueCarnes = (dias: DayCardapio[]): ItemSaqueProcessado[] => {
            const lista: ItemSaqueProcessado[] = [];

            const adicionarItem = (params: {
              id: string;
              dia: DayCardapio;
              dayIdx: number;
              preparacao: string;
              origem: ItemSaqueProcessado['origem'];
              tipoCarne?: string;
              quantidadeKg?: number | string;
              observacao?: string;
              isAdicional?: boolean;
            }) => {
              if (!params.tipoCarne) return;
              const regra = REGRAS_DESCONGELAMENTO[params.tipoCarne] || { diasAntecedencia: 2 };
              const calc = calcularDataSaque(params.dia.date, regra.diasAntecedencia);
              const qtd = Number(params.quantidadeKg) || 0;

              lista.push({
                id: params.id,
                diaCardapioIso: params.dia.date,
                diaSemanaCardapioLabel: params.dia.diaSemanaLabel,
                preparacao: params.preparacao,
                origem: params.origem,
                tipoCarne: params.tipoCarne,
                quantidadeKg: qtd,
                diasAntecedencia: regra.diasAntecedencia,
                dataSaqueIso: calc.dataSaqueIso,
                dataSaqueFormatada: calc.dataSaqueFormatada,
                diaSemanaSaque: calc.diaSemanaSaque,
                ehFimDeSemana: calc.ehFimDeSemana,
                observacao: params.observacao,
                diaIndex: params.dayIdx,
                isAdicional: params.isAdicional ?? false
              });
            };

            dias.forEach((dia, dayIdx) => {
              adicionarItem({
                id: `saque-${dia.date}-almoco-geral`,
                dia,
                dayIdx,
                preparacao: dia.almoco?.geral?.proteina || 'Proteína do almoço geral a definir',
                origem: 'ALMOÇO GERAL',
                tipoCarne: dia.almoco?.geral?.tipoCarne,
                quantidadeKg: dia.almoco?.geral?.quantidadeKg
              });

              dia.almoco?.geral?.carnesAdicionais?.forEach((adicional, adIdx) => {
                adicionarItem({
                  id: `saque-${dia.date}-almoco-geral-adicional-${adIdx}`,
                  dia,
                  dayIdx,
                  preparacao: `${dia.almoco.geral.proteina || 'Almoço geral'} (Corte Adicional)`,
                  origem: 'ALMOÇO GERAL',
                  tipoCarne: adicional.tipoCarne,
                  quantidadeKg: adicional.quantidadeKg,
                  observacao: adicional.observacao,
                  isAdicional: true
                });
              });

              adicionarItem({
                id: `saque-${dia.date}-almoco-paciente`,
                dia,
                dayIdx,
                preparacao: dia.almoco?.pacienteProteina || 'Proteína do almoço do paciente a definir',
                origem: 'ALMOÇO PACIENTE',
                tipoCarne: dia.almoco?.pacienteTipoCarne,
                quantidadeKg: dia.almoco?.pacienteQuantidadeKg
              });

              adicionarItem({
                id: `saque-${dia.date}-jantar-paciente`,
                dia,
                dayIdx,
                preparacao: dia.jantarPaciente?.proteina || 'Proteína do jantar do paciente a definir',
                origem: 'JANTAR PACIENTE',
                tipoCarne: dia.jantarPaciente?.tipoCarne,
                quantidadeKg: dia.jantarPaciente?.quantidadeKg
              });
            });

            lista.sort((a, b) => {
              const byDate = a.dataSaqueIso.localeCompare(b.dataSaqueIso);
              if (byDate !== 0) return byDate;
              const byConsumptionDay = a.diaCardapioIso.localeCompare(b.diaCardapioIso);
              if (byConsumptionDay !== 0) return byConsumptionDay;
              return a.origem.localeCompare(b.origem);
            });

            return lista;
          };

          export const generateWeeklyDates"""
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'generator replacement: expected 1 match, found {count}')

          replace_once(
          """        pacienteProteina: i === 2 ? 'ALCATRA GRELHADA EM TIRAS' : 'PEITO FRANGO GRELHADO'
              },
              jantarPaciente: {
                proteina: '',
                prato: 'Arroz, feijão, ISCAS DE CARNE ACEBOLADA, legumes ao vapor, sopa de legumes, fruta'
              },
""",
          """        pacienteProteina: i === 2 ? 'ALCATRA GRELHADA EM TIRAS' : 'PEITO FRANGO GRELHADO',
                pacienteTipoCarne: '',
                pacienteQuantidadeKg: ''
              },
              jantarPaciente: {
                proteina: '',
                tipoCarne: '',
                quantidadeKg: '',
                prato: 'Arroz, feijão, ISCAS DE CARNE ACEBOLADA, legumes ao vapor, sopa de legumes, fruta'
              },
""",
          'new week defaults')

          replace_once(
          """        pacienteProteina: ''
              },
              jantarPaciente: {
                proteina: '',
                prato: ''
              },
""",
          """        pacienteProteina: '',
                pacienteTipoCarne: '',
                pacienteQuantidadeKg: ''
              },
              jantarPaciente: {
                proteina: '',
                tipoCarne: '',
                quantidadeKg: '',
                prato: ''
              },
""",
          'clear day patient defaults')

          replace_once(
          """      text += `   • Consumo: ${item.diaSemanaCardapioLabel} (${formatDdmmyyyy(item.diaCardapioIso)}) - ${item.preparacao}\\
`;
""",
          """      text += `   • Consumo: ${item.origem} — ${item.diaSemanaCardapioLabel} (${formatDdmmyyyy(item.diaCardapioIso)}) - ${item.preparacao}\\
`;
""",
          'text export origin')

          replace_once(
          """                                      Almoço: {item.preparacao}
""",
          """                                      {item.origem}: {item.preparacao}
""",
          'pdf requisition origin label')

          replace_once(
          """        const diasComSaqueCompleto = currentCardapio.dias.filter(dia =>
                  Boolean(dia.almoco.geral.tipoCarne) && Number(dia.almoco.geral.quantidadeKg) > 0
                ).length;
""",
          """        const itensSaqueProgramados = listaProteinasSemana.filter(item => item.tipoCarne && item.quantidadeKg > 0).length;
""",
          'summary item count')

          replace_once(
          """                <span className={cn(
                          \"px-2 py-1 rounded-full border\",
                          diasComSaqueCompleto === currentCardapio.dias.length
                            ? \"bg-emerald-50 text-emerald-800 border-emerald-200\"
                            : \"bg-amber-50 text-amber-900 border-amber-200\"
                        )}>
                          {diasComSaqueCompleto}/{currentCardapio.dias.length} dias completos
                        </span>
""",
          """                <span className=\"px-2 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200\">
                          {itensSaqueProgramados} itens de carne programados
                        </span>
""",
          'summary badge')

          lunch_marker = """                    ))}
                  </div>
                </div>
              </div>

              {/* Refeição 5: Jantar PACIENTE */}
"""
          lunch_insert = """                    ))}
                  </div>

                  <div className=\"mt-3 grid grid-cols-1 md:grid-cols-3 gap-3 p-3 rounded-lg bg-amber-50/70 border border-amber-300\">
                    <div className=\"md:col-span-2 space-y-1\">
                      <label className=\"text-[10px] font-black text-amber-950 uppercase tracking-wide block\">
                        Corte / Matéria-Prima — Almoço Paciente
                      </label>
                      <select
                        value={currentCardapio.dias[editingDayIndex].almoco.pacienteTipoCarne || ''}
                        onChange={e => {
                          const updated = JSON.parse(JSON.stringify(currentCardapio)) as WeeklyCardapioDoc;
                          updated.dias[editingDayIndex].almoco.pacienteTipoCarne = e.target.value;
                          updateCurrentCardapio(updated);
                        }}
                        className=\"w-full px-3 py-2 border-2 border-amber-400 rounded-lg text-xs font-bold bg-white text-slate-900 focus:ring-2 focus:ring-amber-500 outline-none\"
                      >
                        <option value=\"\">-- Selecione o Tipo da Carne --</option>
                        {TIPOS_CARNE_OPCOES.map(opcao => (
                          <option key={`paciente-almoco-${opcao}`} value={opcao}>
                            {opcao} ({REGRAS_DESCONGELAMENTO[opcao]?.diasAntecedencia || 2}d de antecedência)
                          </option>
                        ))}
                      </select>
                    </div>
                    <div className=\"space-y-1\">
                      <label className=\"text-[10px] font-black text-amber-950 uppercase tracking-wide block\">
                        Quantidade (Kg)
                      </label>
                      <div className=\"relative\">
                        <input
                          type=\"number\"
                          step=\"0.5\"
                          min=\"0\"
                          value={currentCardapio.dias[editingDayIndex].almoco.pacienteQuantidadeKg ?? ''}
                          onChange={e => {
                            const updated = JSON.parse(JSON.stringify(currentCardapio)) as WeeklyCardapioDoc;
                            updated.dias[editingDayIndex].almoco.pacienteQuantidadeKg = e.target.value === '' ? '' : parseFloat(e.target.value);
                            updateCurrentCardapio(updated);
                          }}
                          className=\"w-full pl-3 pr-8 py-2 border-2 border-amber-400 rounded-lg text-xs font-black bg-white text-amber-950 focus:ring-2 focus:ring-amber-500 outline-none\"
                          placeholder=\"Ex: 8\"
                        />
                        <span className=\"absolute right-2.5 top-2.5 text-xs font-black text-amber-800\">kg</span>
                      </div>
                    </div>
                    <p className=\"md:col-span-3 text-[10px] text-amber-800 font-medium\">
                      Estes dados entram automaticamente no Saque de Carnes como <strong>ALMOÇO PACIENTE</strong> e não alteram a descrição impressa no cardápio A4.
                    </p>
                  </div>
                </div>
              </div>

              {/* Refeição 5: Jantar PACIENTE */}
"""
          if source.count(lunch_marker) != 1:
              raise SystemExit(f'lunch patient UI marker: expected 1, found {source.count(lunch_marker)}')
          source = source.replace(lunch_marker, lunch_insert, 1)

          dinner_marker = """                    ))}
                  </div>
                </div>

                <div className=\"space-y-1.5\">
                  <label className=\"text-[10px] font-bold text-slate-600 uppercase block\">
                    Demais componentes do jantar
"""
          dinner_insert = """                    ))}
                  </div>

                  <div className=\"mt-3 grid grid-cols-1 md:grid-cols-3 gap-3 p-3 rounded-lg bg-amber-50/70 border border-amber-300\">
                    <div className=\"md:col-span-2 space-y-1\">
                      <label className=\"text-[10px] font-black text-amber-950 uppercase tracking-wide block\">
                        Corte / Matéria-Prima — Jantar Paciente
                      </label>
                      <select
                        value={currentCardapio.dias[editingDayIndex].jantarPaciente.tipoCarne || ''}
                        onChange={e => {
                          const updated = JSON.parse(JSON.stringify(currentCardapio)) as WeeklyCardapioDoc;
                          updated.dias[editingDayIndex].jantarPaciente.tipoCarne = e.target.value;
                          updateCurrentCardapio(updated);
                        }}
                        className=\"w-full px-3 py-2 border-2 border-amber-400 rounded-lg text-xs font-bold bg-white text-slate-900 focus:ring-2 focus:ring-amber-500 outline-none\"
                      >
                        <option value=\"\">-- Selecione o Tipo da Carne --</option>
                        {TIPOS_CARNE_OPCOES.map(opcao => (
                          <option key={`paciente-jantar-${opcao}`} value={opcao}>
                            {opcao} ({REGRAS_DESCONGELAMENTO[opcao]?.diasAntecedencia || 2}d de antecedência)
                          </option>
                        ))}
                      </select>
                    </div>
                    <div className=\"space-y-1\">
                      <label className=\"text-[10px] font-black text-amber-950 uppercase tracking-wide block\">
                        Quantidade (Kg)
                      </label>
                      <div className=\"relative\">
                        <input
                          type=\"number\"
                          step=\"0.5\"
                          min=\"0\"
                          value={currentCardapio.dias[editingDayIndex].jantarPaciente.quantidadeKg ?? ''}
                          onChange={e => {
                            const updated = JSON.parse(JSON.stringify(currentCardapio)) as WeeklyCardapioDoc;
                            updated.dias[editingDayIndex].jantarPaciente.quantidadeKg = e.target.value === '' ? '' : parseFloat(e.target.value);
                            updateCurrentCardapio(updated);
                          }}
                          className=\"w-full pl-3 pr-8 py-2 border-2 border-amber-400 rounded-lg text-xs font-black bg-white text-amber-950 focus:ring-2 focus:ring-amber-500 outline-none\"
                          placeholder=\"Ex: 10\"
                        />
                        <span className=\"absolute right-2.5 top-2.5 text-xs font-black text-amber-800\">kg</span>
                      </div>
                    </div>
                    <p className=\"md:col-span-3 text-[10px] text-amber-800 font-medium\">
                      Estes dados entram automaticamente no Saque de Carnes como <strong>JANTAR PACIENTE</strong> e não alteram a descrição impressa no cardápio A4.
                    </p>
                  </div>
                </div>

                <div className=\"space-y-1.5\">
                  <label className=\"text-[10px] font-bold text-slate-600 uppercase block\">
                    Demais componentes do jantar
"""
          if source.count(dinner_marker) != 1:
              raise SystemExit(f'dinner patient UI marker: expected 1, found {source.count(dinner_marker)}')
          source = source.replace(dinner_marker, dinner_insert, 1)

          component.write_text(source, encoding='utf-8')

          validation = Path('lib/persistence/validation.ts')
          v = validation.read_text(encoding='utf-8')
          old = """    typeof value.almoco.pacienteProteina !== 'string' ||
              !object(value.jantarPaciente) || typeof value.jantarPaciente.prato !== 'string' ||
              !optional(value.jantarPaciente, 'proteina', 'string')) return false;
"""
          new = """    typeof value.almoco.pacienteProteina !== 'string' ||
              !optional(value.almoco, 'pacienteTipoCarne', 'string') || !quantity(value.almoco.pacienteQuantidadeKg) ||
              !object(value.jantarPaciente) || typeof value.jantarPaciente.prato !== 'string' ||
              !optional(value.jantarPaciente, 'proteina', 'string') ||
              !optional(value.jantarPaciente, 'tipoCarne', 'string') || !quantity(value.jantarPaciente.quantidadeKg)) return false;
"""
          if v.count(old) != 1:
              raise SystemExit(f'validation block: expected 1, found {v.count(old)}')
          validation.write_text(v.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/saque-paciente-regression.mjs')
          test.write_text("""import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const source = fs.readFileSync('components/CardapioSemanal.tsx', 'utf8');
          const validation = fs.readFileSync('lib/persistence/validation.ts', 'utf8');

          const required = [
            'pacienteTipoCarne?: string',
            'pacienteQuantidadeKg?: number | string',
            "origem: 'ALMOÇO GERAL' | 'ALMOÇO PACIENTE' | 'JANTAR PACIENTE'",
            "origem: 'ALMOÇO PACIENTE'",
            "origem: 'JANTAR PACIENTE'",
            'quantidadeKg: dia.almoco?.pacienteQuantidadeKg',
            'quantidadeKg: dia.jantarPaciente?.quantidadeKg',
            "value={currentCardapio.dias[editingDayIndex].almoco.pacienteTipoCarne || ''}",
            "value={currentCardapio.dias[editingDayIndex].almoco.pacienteQuantidadeKg ?? ''}",
            "value={currentCardapio.dias[editingDayIndex].jantarPaciente.tipoCarne || ''}",
            "value={currentCardapio.dias[editingDayIndex].jantarPaciente.quantidadeKg ?? ''}",
            '{item.origem}: {item.preparacao}'
          ];
          for (const marker of required) assert.ok(source.includes(marker), `Missing marker: ${marker}`);
          assert.ok(validation.includes("optional(value.almoco, 'pacienteTipoCarne', 'string')"));
          assert.ok(validation.includes('quantity(value.almoco.pacienteQuantidadeKg)'));
          assert.ok(validation.includes("optional(value.jantarPaciente, 'tipoCarne', 'string')"));
          assert.ok(validation.includes('quantity(value.jantarPaciente.quantidadeKg)'));
          console.log('Patient lunch and dinner meat requisition regression checks passed.');
          """, encoding='utf-8')

          workflow = Path('.github/workflows/validate.yml')
          w = workflow.read_text(encoding='utf-8')
          marker = """      - name: Persistence and recovery tests
                run: bun run test
"""
          addition = marker + """      - name: Patient meat requisition regression
                run: node tests/saque-paciente-regression.mjs
"""
          if w.count(marker) != 1:
              raise SystemExit(f'validate workflow marker: expected 1, found {w.count(marker)}')
          workflow.write_text(w.replace(marker, addition, 1), encoding='utf-8')
          PY
      - name: Commit correction
        shell: bash
        run: |
          rm .github/workflows/temp-fix-saque-paciente.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/CardapioSemanal.tsx lib/persistence/validation.ts tests/saque-paciente-regression.mjs .github/workflows/validate.yml .github/workflows/temp-fix-saque-paciente.yml
          git commit -m "Incluir proteínas dos pacientes no saque de carnes"
          git push origin HEAD:fix/saque-carnes-pacientes-final
