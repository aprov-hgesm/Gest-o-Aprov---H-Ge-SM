name: Validate Firestore integration
on:
  push:
    branches: [main, codex/integracao-firestore]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Reconcile existing lockfile
        run: |
          bun install
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const lock = readFileSync('bun.lock', 'utf8');
          for (let offset = 0; offset < lock.length; offset += 8192) {
            console.log('APROV_LOCK_CHUNK ' + JSON.stringify(lock.slice(offset, offset + 8192)));
          }
          JS
      - name: TypeScript
        run: bun run typecheck
      - name: Persistence and recovery tests
        run: bun run test
      - name: Firestore emulator and security rules
        run: bun run test:firestore
      - name: Production build
        run: bun run build
        env:
          NODE_ENV: production
