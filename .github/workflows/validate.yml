name: Validate Firestore integration
on:
  push:
    branches: [main, codex/integracao-firestore]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run typecheck
      - name: Persistence and recovery tests
        run: bun run test
      - name: Functional integrity tests
        run: node --test tests/integrity-functional.test.ts
      - name: Operational calendar tests
        run: node --test tests/operational-calendar.test.ts
      - name: Professional flows tests
        run: |
          node --test tests/professional-flows.test.ts
          node tests/professional-flows-smoke.mjs
      - name: Block 4A functional audit tests
        run: |
          node --test tests/block4a-functional-audit.test.ts
          node tests/block4a-ui-smoke.mjs
      - name: Block 4B navigation and integration tests
        run: |
          node --test tests/block4b-navigation.test.ts
          node tests/block4b-ui-smoke.mjs
      - name: Block 5 Saque de Carnes tests
        run: |
          node --test tests/block5-saque-operacional.test.ts
          node tests/block5-ui-smoke.mjs
      - name: Block 6 operational closure tests
        run: |
          node --test tests/block6-operational-closure.test.ts
          node tests/block6-ui-smoke.mjs
      - name: Manual roster selection rules
        run: node tests/manual-roster-selection-smoke.mjs
      - name: Patient meat requisition regression
        run: node tests/saque-paciente-regression.mjs
      - name: Firestore emulator and security rules
        run: bun run test:firestore
      - name: Production build
        run: bun run build
        env:
          NODE_ENV: production
      - name: Prepare isolated browser test tools
        run: |
          npm install --prefix /tmp/aprov-browser-tools --no-save --package-lock=false playwright
          node /tmp/aprov-browser-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Two-browser smoke test
        run: bunx firebase emulators:exec --only firestore --project demo-aprov --config tests/firebase.browser.json "node tests/browser-smoke.mjs"
        env:
          APROV_PLAYWRIGHT_MODULE: /tmp/aprov-browser-tools/node_modules/playwright/index.mjs
      - name: PDF download smoke test
        run: bunx firebase emulators:exec --only firestore --project demo-aprov --config tests/firebase.browser.json "node tests/pdf-download-smoke.mjs"
        env:
          APROV_PLAYWRIGHT_MODULE: /tmp/aprov-browser-tools/node_modules/playwright/index.mjs
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-browser-check
          path: test-results/
          if-no-files-found: ignore