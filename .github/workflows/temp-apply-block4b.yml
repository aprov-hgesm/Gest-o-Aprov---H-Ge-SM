name: Apply Block 4B UX Integration
on:
  push:
    branches:
      - feature/bloco4b-ux-integracao
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/bloco4b-ux-integracao
          fetch-depth: 0
      - name: Aplicar Bloco 4B
        run: |
          python scripts/prepare_block4b_patch.py
          python scripts/apply_block4b.py
          node --test tests/block4b-navigation.test.ts
      - name: Commit das alterações funcionais
        run: |
          rm scripts/apply_block4b.py scripts/prepare_block4b_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/CardapioSemanal.tsx components/OperationalDashboard.tsx components/ProfessionalFlows.tsx lib/domain/operational-navigation.ts components/OperationalContextBar.tsx tests/block4b-navigation.test.ts scripts/apply_block4b.py scripts/prepare_block4b_patch.py
          git commit -m "Integrar navegação contextual e fluxos entre módulos no Bloco 4B"
          git push origin HEAD:feature/bloco4b-ux-integracao
