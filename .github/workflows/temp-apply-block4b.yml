name: Apply Block 4B UX Integration
on:
  push:
    branches:
      - feature/bloco4b-ux-integracao
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/bloco4b-ux-integracao
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Corrigir fechamento do card métrico
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/OperationalDashboard.tsx')
          t = p.read_text()
          old = '''      <div className="text-[11px] text-slate-500 mt-1">{detail}</div>
              </div>
            );
          }'''
          new = '''      <div className="text-[11px] text-slate-500 mt-1">{detail}</div>
              </button>
            );
          }'''
          if old not in t:
              old = '''      <div className="text-[11px] text-slate-500 mt-1">{detail}</div>
              </div>
          );
          }'''
              new = '''      <div className="text-[11px] text-slate-500 mt-1">{detail}</div>
              </button>
          );
          }'''
          if old not in t:
              old = '      <div className="text-[11px] text-slate-500 mt-1">{detail}</div>\n    </div>\n  );\n}'
              new = '      <div className="text-[11px] text-slate-500 mt-1">{detail}</div>\n    </button>\n  );\n}'
          if old not in t:
              raise SystemExit('Fechamento do MetricCard não encontrado')
          p.write_text(t.replace(old, new, 1))
          PY
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run typecheck
      - name: Block 4B navigation tests
        run: node --test tests/block4b-navigation.test.ts
      - name: Production build
        run: bun run build
        env:
          NODE_ENV: production
      - name: Commit da correção validada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/OperationalDashboard.tsx
          git commit -m "Corrigir card métrico interativo do Bloco 4B"
          git push origin HEAD:feature/bloco4b-ux-integracao
