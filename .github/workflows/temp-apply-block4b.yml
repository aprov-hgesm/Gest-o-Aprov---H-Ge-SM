name: Apply Block 4B UX Integration
on:
  push:
    branches:
      - feature/bloco4b-ux-integracao
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/bloco4b-ux-integracao
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Corrigir tags JSX do dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/OperationalDashboard.tsx')
          t = p.read_text()
          alerts_bad = '''        ))}
              </div>
            </button>
          );
        }

        export default function OperationalDashboard'''
          alerts_good = '''        ))}
              </div>
            </div>
          );
        }

        export default function OperationalDashboard'''
          if alerts_bad not in t:
              alerts_bad = '        ))}\n      </div>\n    </button>\n  );\n}\n\nexport default function OperationalDashboard'
              alerts_good = '        ))}\n      </div>\n    </div>\n  );\n}\n\nexport default function OperationalDashboard'
          if alerts_bad not in t:
              raise SystemExit('Fechamento do painel de alertas não encontrado')
          t = t.replace(alerts_bad, alerts_good, 1)

          metric_bad = '      <div className="text-[11px] text-slate-500 mt-1">{detail}</div>\n    </div>\n  );\n}'
          metric_good = '      <div className="text-[11px] text-slate-500 mt-1">{detail}</div>\n    </button>\n  );\n}'
          if metric_bad not in t:
              raise SystemExit('Fechamento do MetricCard não encontrado')
          t = t.replace(metric_bad, metric_good, 1)
          p.write_text(t)
          PY
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run typecheck
      - name: Block 4B navigation tests
        run: node --test tests/block4b-navigation.test.ts
      - name: Production build
        run: bun run build
        env:
          NODE_ENV: production
      - name: Commit da correção validada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/OperationalDashboard.tsx
          git commit -m "Corrigir tags JSX do dashboard no Bloco 4B"
          git push origin HEAD:feature/bloco4b-ux-integracao
