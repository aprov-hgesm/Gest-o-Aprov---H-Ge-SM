name: Apply Block 4B UX Integration
on:
  push:
    branches:
      - feature/bloco4b-ux-integracao
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/bloco4b-ux-integracao
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Corrigir tags JSX do dashboard
        run: |
          python -c "from pathlib import Path; p=Path('components/OperationalDashboard.tsx'); t=p.read_text(); bad='        ))}\\n      </div>\\n    </button>\\n  );\\n}\\n\\nexport default function OperationalDashboard'; good='        ))}\\n      </div>\\n    </div>\\n  );\\n}\\n\\nexport default function OperationalDashboard'; assert bad in t, 'painel de alertas não encontrado'; p.write_text(t.replace(bad, good, 1))"
          python -c "from pathlib import Path; p=Path('components/OperationalDashboard.tsx'); t=p.read_text(); bad='      <div className=\"text-[11px] text-slate-500 mt-1\">{detail}</div>\\n    </div>\\n  );\\n}'; good='      <div className=\"text-[11px] text-slate-500 mt-1\">{detail}</div>\\n    </button>\\n  );\\n}'; assert bad in t, 'MetricCard não encontrado'; p.write_text(t.replace(bad, good, 1))"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run typecheck
      - name: Block 4B navigation tests
        run: node --test tests/block4b-navigation.test.ts
      - name: Production build
        run: bun run build
        env:
          NODE_ENV: production
      - name: Commit da correção validada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/OperationalDashboard.tsx
          git commit -m "Corrigir tags JSX do dashboard no Bloco 4B"
          git push origin HEAD:feature/bloco4b-ux-integracao
